<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AntiProxy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-500 to-purple-600 min-h-screen flex items-center justify-center p-4">
    <div class="glass p-10 rounded-3xl shadow-2xl w-full max-w-md transform hover:scale-[1.01] transition-transform">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-white drop-shadow-md">AntiProxy</h1>
            <p class="text-indigo-100 mt-2 font-medium">Secure Admin Access</p>
        </div>
        
        {% if error %}
        <div class="bg-red-500/20 border border-red-500/50 text-red-100 px-4 py-3 rounded-xl mb-6 text-sm text-center">
            {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="post" class="space-y-6">
            <div>
                <label class="block text-sm font-semibold text-white mb-2 ml-1">Access Password</label>
                <input type="password" name="password" required 
                       class="w-full bg-white/20 border border-white/30 rounded-2xl p-4 text-white placeholder-white/60 focus:outline-none focus:ring-2 focus:ring-white/50 transition-all shadow-inner"
                       placeholder="••••••••">
            </div>
            
            <button type="submit" 
                    class="w-full bg-white text-indigo-600 font-bold py-4 rounded-2xl shadow-xl hover:bg-indigo-50 hover:shadow-indigo-500/40 transition-all active:scale-95">
                Unlock Dashboard
            </button>
        </form>
        
        <div class="mt-8 text-center">
            <p class="text-white/60 text-xs">Protected by Antigravity AI Security</p>
        </div>
    </div>
</body>
</html>
