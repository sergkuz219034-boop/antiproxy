<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - AntiProxy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-200 text-gray-900 font-sans min-h-screen">
    <nav class="bg-indigo-600 text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <a href="/" class="text-2xl font-bold tracking-tight">AntiProxy <span class="text-indigo-300 text-sm align-top">PRO</span></a>
            <div class="space-x-6 text-sm font-medium">
                <a href="/" class="hover:text-indigo-200 transition-colors">Dashboard</a>
                <a href="/accounts" class="hover:text-indigo-200 transition-colors">Accounts</a>
                <a href="/proxies" class="hover:text-indigo-200 transition-colors">Proxies</a>
                <a href="/automation" class="bg-white/20 px-3 py-1 rounded hover:bg-white/30 transition-colors">Automation</a>
                <a href="/logout" class="text-indigo-200 hover:text-white transition-colors">Logout</a>
            </div>
        </div>
    </nav>
    <main class="container mx-auto mt-8 p-4">
        {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
</body>
</html>
