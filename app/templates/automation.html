{% extends "base.html" %}
{% block content %}
<div class="glass p-8 rounded-2xl shadow-xl">
    <h2 class="text-2xl font-bold mb-6 text-indigo-900">Antigravity Automation</h2>
    
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
        <!-- Automation Controls -->
        <div class="md:col-span-1 space-y-6">
            <div class="bg-white/80 p-6 rounded-xl border border-indigo-100 shadow-sm">
                <h3 class="font-bold text-indigo-900 mb-4">Run Action</h3>
                <form class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Target Binding</label>
                        <select name="binding_id" class="w-full border-gray-300 rounded-lg p-2.5 border">
                            {% for binding in bindings %}
                            <option value="{{ binding.id }}">{{ binding.profile.name }} ({{ binding.account.email if binding.account else 'No Account' }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Select Script</label>
                        <select name="script" class="w-full border-gray-300 rounded-lg p-2.5 border">
                            <option value="check_login">Check Google Login</option>
                            <option value="clear_cache">Clear Browser Cache</option>
                            <option value="warmup">Profile Warmup (Browse)</option>
                            <option value="custom">Custom Antigravity Task</option>
                        </select>
                    </div>
                    <button type="button" onclick="runAutomation()" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-bold shadow-lg hover:bg-indigo-700 transition-all">Start Automation</button>
                </form>
            </div>

            <div class="bg-gradient-to-br from-indigo-600 to-purple-700 p-6 rounded-xl text-white shadow-xl">
                <h3 class="font-bold text-lg mb-2">Antigravity AI</h3>
                <p class="text-indigo-100 text-sm mb-4">Give a natural language command to the automation engine.</p>
                <textarea id="ai-command" class="w-full bg-white/10 border border-white/20 rounded-lg p-3 text-sm text-white placeholder-white/50 focus:ring-0 outline-none" rows="3" placeholder="e.g. 'Login to Google and check if the account is restricted'"></textarea>
                <button onclick="sendAiCommand()" class="mt-3 w-full bg-white text-indigo-600 py-2 rounded-lg font-bold hover:bg-indigo-50 transition-colors">Send Command</button>
            </div>
        </div>

        <!-- Progress & Results -->
        <div class="md:col-span-2">
            <div class="bg-gray-900 rounded-xl p-6 h-full min-h-[500px] flex flex-col shadow-2xl">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-teal-400 font-mono font-bold">Automation Terminal</h3>
                    <div class="flex gap-2">
                        <span class="w-3 h-3 rounded-full bg-red-500"></span>
                        <span class="w-3 h-3 rounded-full bg-yellow-500"></span>
                        <span class="w-3 h-3 rounded-full bg-green-500"></span>
                    </div>
                </div>
                <div id="automation-log" class="flex-grow font-mono text-sm text-gray-300 overflow-y-auto space-y-2">
                    <div class="text-gray-500">> Ready for commands...</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function log(msg, type='info') {
        const container = document.getElementById('automation-log');
        const div = document.createElement('div');
        const colors = {
            info: 'text-gray-300',
            success: 'text-teal-400',
            error: 'text-red-400',
            cmd: 'text-indigo-400'
        };
        div.className = colors[type] || colors.info;
        div.innerHTML = `<span class="text-gray-600 mr-2">${new Date().toLocaleTimeString()}</span> > ${msg}`;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }

    function runAutomation() {
        const script = document.querySelector('select[name="script"]').value;
        const bindingId = document.querySelector('select[name="binding_id"]').value;
        
        log(`Requesting automation script: ${script} for binding #${bindingId}...`, 'cmd');
        
        const formData = new FormData();
        formData.append('script', script);
        formData.append('binding_id', bindingId);

        fetch('/api/automation/run', {
            method: 'POST',
            body: formData
        })
        .then(r => r.json())
        .then(data => {
            if (data.status === 'ok') {
                log(`Server acknowledged: ${data.message}`, 'success');
                log(`Monitoring logs for execution progress...`);
            } else {
                log(`Error: ${data.message}`, 'error');
            }
        })
        .catch(err => {
            log(`Network error: ${err.message}`, 'error');
        });
    }

    function sendAiCommand() {
        const cmd = document.getElementById('ai-command').value;
        const bindingId = document.querySelector('select[name="binding_id"]').value;
        if (!cmd) return;
        
        log(`AI Command: "${cmd}"`, 'cmd');
        log(`Antigravity Agent analyzing request...`);
        
        const formData = new FormData();
        formData.append('command', cmd);
        formData.append('binding_id', bindingId);

        fetch('/api/ai/command', {
            method: 'POST',
            body: formData
        })
        .then(r => r.json())
        .then(data => {
            if (data.status === 'ok') {
                log(`Agent acknowledged: ${data.message}`, 'success');
            } else {
                log(`Agent error: ${data.message}`, 'error');
            }
        })
        .catch(err => {
            log(`Network error: ${err.message}`, 'error');
        });
        
        document.getElementById('ai-command').value = '';
    }
</script>
{% endblock %}
