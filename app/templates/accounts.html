{% extends "base.html" %}
{% block content %}
<div class="glass p-8 rounded-2xl shadow-xl">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-indigo-900">Accounts</h2>
        <button onclick="document.getElementById('new-account-modal').classList.remove('hidden')" class="bg-indigo-600 text-white px-5 py-2.5 rounded-lg shadow-lg hover:bg-indigo-700 hover:shadow-indigo-500/30 transition-all font-medium">Add Account</button>
    </div>
    <div class="overflow-x-auto rounded-xl shadow-sm border border-gray-100">
        <table class="min-w-full bg-white/90">
            <thead>
                <tr class="bg-gray-50/80 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">
                    <th class="py-4 px-6 border-b">ID</th>
                    <th class="py-4 px-6 border-b">Email</th>
                    <th class="py-4 px-6 border-b">Status</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
                {% for account in accounts %}
                <tr class="hover:bg-indigo-50/50 transition-colors">
                    <td class="py-4 px-6 text-sm text-gray-500">{{ account.id }}</td>
                    <td class="py-4 px-6 font-medium text-indigo-900">{{ account.email }}</td>
                    <td class="py-4 px-6">
                        <span class="px-3 py-1 bg-green-100 text-green-700 rounded-full text-xs font-medium">{{ account.status }}</span>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="3" class="py-8 text-center text-gray-500">No accounts added yet.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<!-- Modal -->
<div id="new-account-modal" class="hidden fixed inset-0 bg-gray-900/60 backdrop-blur-sm overflow-y-auto h-full w-full flex justify-center items-center z-50">
    <div class="bg-white p-8 rounded-2xl shadow-2xl w-[28rem] transform transition-all">
        <h3 class="text-2xl font-bold mb-6 text-gray-900">Add Google Account</h3>
        <form hx-post="/api/accounts" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Email <span class="text-red-500">*</span></label>
                <input type="email" name="email" class="w-full border-gray-300 rounded-lg shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2.5 border" required placeholder="user@gmail.com">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Password (optional)</label>
                <input type="password" name="password" class="w-full border-gray-300 rounded-lg shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2.5 border" placeholder="••••••••">
            </div>
            <div class="flex justify-end gap-3 mt-8">
                <button type="button" onclick="document.getElementById('new-account-modal').classList.add('hidden')" class="bg-gray-100 text-gray-700 px-5 py-2 rounded-lg font-medium hover:bg-gray-200 transition-colors">Cancel</button>
                <button type="submit" class="bg-indigo-600 text-white px-5 py-2 rounded-lg font-medium shadow-md hover:bg-indigo-700 transition-colors">Add</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
