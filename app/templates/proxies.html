{% extends "base.html" %}
{% block content %}
<div class="glass p-8 rounded-2xl shadow-xl">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-indigo-900">Proxies</h2>
        <button onclick="document.getElementById('new-proxy-modal').classList.remove('hidden')" class="bg-indigo-600 text-white px-5 py-2.5 rounded-lg shadow-lg hover:bg-indigo-700 hover:shadow-indigo-500/30 transition-all font-medium">Add Proxy</button>
    </div>
    <div class="overflow-x-auto rounded-xl shadow-sm border border-gray-100">
        <table class="min-w-full bg-white/90">
            <thead>
                <tr class="bg-gray-50/80 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">
                    <th class="py-4 px-6 border-b">Name</th>
                    <th class="py-4 px-6 border-b">Protocol</th>
                    <th class="py-4 px-6 border-b">Host:Port</th>
                    <th class="py-4 px-6 border-b">Username</th>
                    <th class="py-4 px-6 border-b">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
                {% for proxy in proxies %}
                <tr class="hover:bg-indigo-50/50 transition-colors">
                    <td class="py-4 px-6 font-medium text-indigo-900">{{ proxy.name }}</td>
                    <td class="py-4 px-6 text-sm text-gray-600 uppercase">{{ proxy.protocol }}</td>
                    <td class="py-4 px-6 font-mono text-sm">{{ proxy.host }}:{{ proxy.port }}</td>
                    <td class="py-4 px-6 text-sm text-gray-600">{{ proxy.username or 'None' }}</td>
                    <td class="py-4 px-6">
                        <button 
                            onclick="checkProxy(this, {{ proxy.id }})" 
                            class="bg-indigo-100 text-indigo-600 px-3 py-1 rounded-md hover:bg-indigo-200 text-xs font-bold transition-colors">
                            Check Connection
                        </button>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="5" class="py-8 text-center text-gray-500">No proxies added yet.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<!-- Modal -->
<div id="new-proxy-modal" class="hidden fixed inset-0 bg-gray-900/60 backdrop-blur-sm overflow-y-auto h-full w-full flex justify-center items-center z-50">
    <div class="bg-white p-8 rounded-2xl shadow-2xl w-[28rem] transform transition-all">
        <h3 class="text-2xl font-bold mb-6 text-gray-900">Add Proxy</h3>
        <form hx-post="/api/proxies" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Name <span class="text-red-500">*</span></label>
                <input type="text" name="name" class="w-full border-gray-300 rounded-lg shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2.5 border" required placeholder="My Proxy">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Protocol <span class="text-red-500">*</span></label>
                    <select name="protocol" class="w-full border-gray-300 rounded-lg shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2.5 border">
                        <option value="socks5">SOCKS5</option>
                        <option value="http">HTTP</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Host <span class="text-red-500">*</span></label>
                    <input type="text" name="host" class="w-full border-gray-300 rounded-lg shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2.5 border" required placeholder="127.0.0.1">
                </div>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Port <span class="text-red-500">*</span></label>
                <input type="number" name="port" class="w-full border-gray-300 rounded-lg shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2.5 border" required placeholder="1080">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Username (Optional)</label>
                <input type="text" name="username" class="w-full border-gray-300 rounded-lg shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2.5 border">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Password (Optional)</label>
                <input type="password" name="password" class="w-full border-gray-300 rounded-lg shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2.5 border">
            </div>
            <div class="flex justify-end gap-3 mt-8">
                <button type="button" onclick="document.getElementById('new-proxy-modal').classList.add('hidden')" class="bg-gray-100 text-gray-700 px-5 py-2 rounded-lg font-medium hover:bg-gray-200 transition-colors">Cancel</button>
                <button type="submit" class="bg-indigo-600 text-white px-5 py-2 rounded-lg font-medium shadow-md hover:bg-indigo-700 transition-colors">Add</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
